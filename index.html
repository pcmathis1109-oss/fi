<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CinéFilm | Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="app.js"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-900 text-white p-6 flex justify-between items-center shadow-xl sticky top-0 z-50">
        <h1 class="text-2xl font-black italic">CINÉ<span class="text-red-600">FILM</span></h1>
        <nav class="flex gap-4">
            <a href="recent.html" class="text-[10px] font-bold uppercase self-center hover:text-red-500">Nouveautés</a>
            <a href="club.html" class="bg-red-600 px-4 py-2 rounded-full font-bold text-[10px] uppercase shadow-lg">MON CLUB</a>
        </nav>
    </header>

    <main class="p-8">
        <h2 class="text-blue-900 font-black uppercase text-xl mb-8 border-l-4 border-red-600 pl-4">À l'affiche actuellement</h2>
        <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-5 gap-8"></div>
    </main>

    <script>
        async function load() {
            const movies = await getMovies('/movie/now_playing');
            const grid = document.getElementById('movieGrid');
            movies.forEach(m => {
                grid.innerHTML += `
                    <div class="cursor-pointer group" onclick="window.location.href='movie.html?id=${m.id}'">
                        <div class="relative overflow-hidden rounded-2xl shadow-lg border border-white">
                            <img src="${IMG_URL + m.poster_path}" class="w-full h-auto group-hover:scale-110 transition duration-500">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                                <span class="bg-white text-blue-900 text-[10px] font-black px-4 py-2 rounded-full">VOIR DÉTAILS</span>
                            </div>
                        </div>
                        <h3 class="mt-4 font-bold text-sm truncate uppercase text-blue-900 px-1">${m.title}</h3>
                        <p class="text-[10px] text-gray-500 font-bold px-1 italic">⭐ ${m.vote_average.toFixed(1)} / 10</p>
                    </div>`;
            });
        }
        load();
    </script>
</body>
</html>
