<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bientôt | CinéFilm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        :root { --cine-blue: #003366; --cine-red: #e30613; --cine-gray: #f4f4f4; }
        body { background-color: var(--cine-gray); color: #333; font-family: 'Montserrat', sans-serif; }
        .bg-cine-blue { background-color: var(--cine-blue); }
        .text-cine-red { color: var(--cine-red); }
        .movie-card { background: white; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
        .movie-card:hover { transform: translateY(-8px); border: 1px solid var(--cine-red); }
    </style>
</head>
<body>

    <nav class="bg-cine-blue text-white shadow-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-black italic tracking-tighter uppercase cursor-pointer" onclick="window.location.href='index.html'">
                CINÉ<span class="text-cine-red">FILM</span>
            </h1>
            <div class="flex gap-8 font-bold text-xs uppercase tracking-widest">
                <a href="index.html" class="hover:text-cine-red transition">Accueil</a>
                <a href="recent.html" class="hover:text-cine-red transition">À l'affiche</a>
                <a href="upcoming.html" class="text-cine-red">Bientôt</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="flex items-center gap-4 mb-12">
            <h2 class="text-4xl font-black text-cine-blue uppercase italic">Les prochaines <span class="text-cine-red">sorties</span></h2>
        </div>

        <div id="upcomingGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-10"></div>
    </main>

    <script>
        const API_KEY = '65ca4aaf481637e3d3feb421767f11a2';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        async function fetchUpcoming() {
            const res = await fetch(`https://api.themoviedb.org/3/movie/upcoming?api_key=${API_KEY}&language=fr-FR&region=FR`);
            const data = await res.json();
            const grid = document.getElementById('upcomingGrid');
            
            data.results.forEach(movie => {
                grid.innerHTML += `
                    <div class="movie-card cursor-pointer group" onclick="window.location.href='movie.html?id=${movie.id}'">
                        <div class="relative overflow-hidden aspect-[2/3]">
                            <img src="${IMG_URL + movie.poster_path}" class="w-full h-full object-cover">
                            <div class="absolute top-0 right-0 bg-cine-red text-white text-[10px] font-black px-3 py-1 uppercase">Prévu</div>
                        </div>
                        <div class="p-5">
                            <h4 class="font-black text-[11px] text-cine-blue uppercase h-10 overflow-hidden mb-3">${movie.title}</h4>
                            <p class="text-[10px] font-bold text-gray-400 italic">Sortie le : ${movie.release_date.split('-').reverse().join('/')}</p>
                        </div>
                    </div>
                `;
            });
        }
        fetchUpcoming();
    </script>
</body>
</html>
