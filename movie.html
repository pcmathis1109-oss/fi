<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Film | CinéFilm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="app.js"></script>
    <style>
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 20px; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">

    <nav class="bg-blue-950/50 p-6 flex justify-between items-center border-b border-white/10 sticky top-0 z-50 backdrop-blur-md">
        <h1 class="text-2xl font-black italic cursor-pointer tracking-tighter" onclick="window.location.href='index.html'">
            CINÉ<span class="text-red-600">FILM</span>
        </h1>
        <button onclick="window.history.back()" class="text-[10px] font-bold uppercase bg-white/10 px-6 py-2 rounded-full hover:bg-white/20 transition">Retour</button>
    </nav>

    <div id="details" class="max-w-6xl mx-auto p-6 md:p-12">
        <div class="flex items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600"></div>
        </div>
    </div>

    <script>
        const API_URL_SHEET = "https://sheetdb.io/api/v1/ffd07sknkm202";

        async function loadDetails() {
            const params = new URLSearchParams(window.location.search);
            const movieId = params.get('id');
            if (!movieId) return window.location.href = 'index.html';

            try {
                // Récupération des infos du film (TMDB)
                const movie = await fetch(`${BASE_URL}/movie/${movieId}?api_key=${API_KEY}&language=fr-FR`).then(res => res.json());
                const credits = await fetch(`${BASE_URL}/movie/${movieId}/credits?api_key=${API_KEY}&language=fr-FR`).then(res => res.json());
                const videos = await fetch(`${BASE_URL}/movie/${movieId}/videos?api_key=${API_KEY}`).then(res => res.json());
                
                const trailer = videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                const cast = credits.cast.slice(0, 6);

                const detailsDiv = document.getElementById('details');
                detailsDiv.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                        <div class="relative group">
                            <img src="${IMG_URL + movie.poster_path}" class="w-full rounded-[40px] shadow-2xl border border-white/10 group-hover:scale-[1.02] transition duration-500">
                            <div class="absolute top-6 left-6 bg-red-600 px-4 py-2 rounded-2xl font-black text-xs uppercase shadow-lg italic">Nouveauté</div>
                        </div>

                        <div class="lg:col-span-2 space-y-8">
                            <div>
                                <h1 class="text-5xl md:text-7xl font-black uppercase italic leading-none tracking-tighter">${movie.title}</h1>
                                <div class="flex gap-4 mt-4 text-red-500 font-bold text-sm uppercase italic">
                                    <span>${movie.release_date.split('-')[0]}</span>
                                    <span>•</span>
                                    <span>${movie.runtime} min</span>
                                    <span>•</span>
                                    <span class="text-white bg-white/10 px-2 rounded">⭐ ${movie.vote_average.toFixed(1)}</span>
                                </div>
                            </div>

                            <p class="text-lg text-gray-400 leading-relaxed font-medium">${movie.overview || "Aucun résumé disponible."}</p>
                            
                            <div>
                                <h3 class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500 mb-6">Casting Principal</h3>
                                <div class="grid grid-cols-3 md:grid-cols-6 gap-4">
                                    ${cast.map(a => `
                                        <div class="text-center group">
                                            <div class="w-full aspect-square rounded-2xl overflow-hidden border-2 border-white/5 group-hover:border-red-600 transition duration-300 mb-2">
                                                <img src="${a.profile_path ? IMG_URL + a.profile_path : 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
                                            </div>
                                            <p class="text-[9px] font-bold truncate uppercase">${a.name}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            ${trailer ? `
                                <div>
                                    <h3 class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500 mb-6">Bande-annonce officielle</h3>
                                    <div class="video-container shadow-2xl">
                                        <iframe src="https://www.youtube.com/embed/${trailer.key}" frameborder="0" allowfullscreen></iframe>
                                    </div>
                                </div>
                            ` : ''}
                            
                            <button onclick="book('${movie.title.replace(/'/g, "\\'")}')" id="buyBtn" class="w-full bg-red-600 py-6 rounded-[30px] font-black text-xl uppercase italic tracking-tighter hover:bg-red-700 hover:scale-[1.02] active:scale-95 transition-all shadow-2xl shadow-red-600/20 flex items-center justify-center gap-4 group">
                                <span>Prendre ma place (Ciné-Chèque)</span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:translate-x-2 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error("Erreur chargement détails:", error);
            }
        }

        async function book(title) {
            const btn = document.getElementById('buyBtn');
            btn.disabled = true;
            btn.innerText = "Synchronisation...";
            btn.classList.add('opacity-50', 'animate-pulse');

            // ID Unique pour le billet
            const ticketId = `TICKET_${title.replace(/\s+/g, '_').toUpperCase()}_${Math.floor(Math.random()*10000)}`;

            // 1. ENVOI VERS GOOGLE SHEETS (SheetDB)
            try {
                await fetch(API_URL_SHEET, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        data: [
                            { 
                                ticket_id: ticketId, 
                                movie: title, 
                                status: "VALIDE",
                                date_reservation: new Date().toLocaleString('fr-FR')
                            }
                        ]
                    })
                });
            } catch (e) {
                console.error("Erreur API, sauvegarde locale uniquement.");
            }

            // 2. SAUVEGARDE LOCALE (Brouillée en Base64 via app.js)
            const orders = readProtectedData('orders') || [];
            orders.push({ 
                movie: title, 
                date: new Date().toLocaleDateString('fr-FR'), 
                ticket_id: ticketId 
            });
            localStorage.setItem('orders', protectData(orders));

            // Redirection
            window.location.href = 'club.html';
        }

        loadDetails();
    </script>
</body>
</html>
